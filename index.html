<!doctype html>

    <meta name="theme-color" content="#0f1b27">
    <meta
      name="description"
      content="Parcours d’apprentissage interactif pour bien utiliser l’IA : 12 modules, des exercices, des notes, des questions et une bibliothèque de ressources."

    <link rel="icon" href="public/favicon.svg" type="image/svg+xml">

    <link rel="preload" href="public/fonts/inter-latin-ext.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="src/styles/base.css">

              <strong>Parcours IA</strong>

            class="icon-btn menu-toggle"
            id="menu-toggle"

          >
            <svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
              <path d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>

          <a class="mobile-brand" href="#/">
            <span class="brand-mark" aria-hidden="true">

            </span>
            <strong>Parcours IA</strong>
          </a>
          <a class="icon-btn" href="#/questions" aria-label="Mes questions" title="Mes questions">
            <svg class="icon" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

    <noscript>
      <div class="noscript-card">
        <strong>JavaScript est nécessaire.</strong>
        <p>
          Cette application enregistre vos notes et votre progression localement dans le navigateur.
          Activez JavaScript pour l’utiliser.
        </p>
      </div>
    </noscript>

    <script src="src/data/resources.js"></script>
